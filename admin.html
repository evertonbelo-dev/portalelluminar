<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Portal El'Luminar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/portal.css">
<script src="js/env-config.js"></script>
    <style>
        .admin-container { max-width: 900px; margin: 0 auto; padding: 100px 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .admin-header h1 { font-family: 'Cinzel'; color: var(--ouro-solar); font-size: 1.8rem; }
        .admin-card { background: rgba(5,5,16,0.95); border: 1px solid rgba(212,175,55,0.3); border-radius: 15px; padding: 30px; margin-bottom: 25px; }
        .admin-card h2 { font-family: 'Cinzel'; color: var(--dourado-antigo); font-size: 1.2rem; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .admin-card label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 5px; margin-top: 15px; }
        .admin-card select, .admin-card input, .admin-card textarea { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
        .admin-card select:focus, .admin-card input:focus, .admin-card textarea:focus { border-color: var(--ouro-solar); }
        .admin-card textarea { min-height: 80px; resize: vertical; }
        .btn-admin-save { background: linear-gradient(135deg, var(--dourado-antigo), var(--ouro-solar)); border: none; padding: 12px 30px; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; font-family: 'Cinzel'; margin-top: 15px; }
        .btn-admin-save:hover { transform: scale(1.02); }
        .admin-status { padding: 10px 15px; border-radius: 8px; margin-top: 10px; font-size: 0.85rem; display: none; }
        .admin-status.success { display: block; background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3); color: #4caf50; }
        .admin-status.error { display: block; background: rgba(255,100,100,0.15); border: 1px solid rgba(255,100,100,0.3); color: #ff6b6b; }
        .admin-loading { text-align: center; padding: 60px; color: #888; }
        .admin-loading .spin { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(212,175,55,0.2); border-top: 3px solid var(--ouro-solar); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
.admin-tabs { display: flex; gap: 0; margin-bottom: 30px; border-bottom: 2px solid rgba(212,175,55,0.2); overflow-x: auto; flex-wrap: nowrap; }
        .admin-tab { padding: 12px 22px; cursor: pointer; font-family: 'Cinzel'; font-size: 0.85rem; color: #888; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; transition: all 0.3s; white-space: nowrap; background: transparent; }
        .admin-tab:hover { color: var(--dourado-antigo); background: rgba(212,175,55,0.05); }
        .admin-tab.ativa { color: var(--ouro-solar); border-color: rgba(212,175,55,0.3); border-bottom-color: rgba(5,5,16,1); background: rgba(212,175,55,0.08); }
        .admin-tabela { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .admin-tabela th { color: var(--dourado-antigo); font-family: 'Cinzel'; font-size: 0.8rem; padding: 10px 12px; border-bottom: 1px solid rgba(212,175,55,0.3); text-align: left; }
        .admin-tabela td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ccc; font-size: 0.85rem; }
        .admin-tabela tr:hover td { background: rgba(212,175,55,0.03); }
        .badge-admin { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.7rem; background: rgba(212,175,55,0.2); color: var(--ouro-solar); }
        .badge-user { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.7rem; background: rgba(255,255,255,0.05); color: #888; }
        .acoes-usuario button { background: none; border: 1px solid rgba(212,175,55,0.3); color: var(--dourado-antigo); padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; margin: 0 3px; }
        .acoes-usuario button:hover { background: rgba(212,175,55,0.1); }
        .acoes-usuario .btn-excluir { border-color: rgba(255,80,80,0.3); color: #ff6b6b; }
        .acoes-usuario .btn-excluir:hover { background: rgba(255,80,80,0.1); }
        .btn-admin-danger { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3); color: #ff6b6b; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .btn-admin-danger:hover { background: rgba(255,80,80,0.25); }
        .admin-modelo-item { display: flex; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; }
        .admin-modelo-item:hover { border-color: rgba(212,175,55,0.3); }
        .admin-modelo-item.selecionado { border-color: var(--ouro-solar); background: rgba(255,170,0,0.05); }
        .admin-modelo-item input { width: auto; margin-right: 10px; }
        .admin-modelo-item .nome { color: #fff; font-weight: bold; flex: 1; }
        .admin-modelo-item .desc { color: #888; font-size: 0.8rem; }
        .admin-modelo-item .custo { font-size: 0.75rem; padding: 2px 10px; border-radius: 10px; margin-left: 10px; }
        .custo-baixo { background: rgba(76,175,80,0.2); color: #4caf50; }
        .custo-medio { background: rgba(255,193,7,0.2); color: #ffc107; }
        .sql-box { background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 0.75rem; color: #0f0; white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-top: 10px; }
        .sql-copy { background: rgba(255,255,255,0.1); border: 1px solid #555; color: #fff; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-top: 5px; }
        </style>
</head>
<body>
    <a href="index.html" class="link-voltar-home">&larr; Voltar ao Portal</a>
    <div class="admin-container" id="admin-content">
        <div class="admin-loading">
            <div class="spin"></div>
            <p>Verificando permissoes estelares...</p>
        </div>
    </div><div class="admin-tabs" id="admin-tabs-bar">
        <div class="admin-tab ativa" data-tab="geral">🔮 Geral</div>
        <div class="admin-tab" data-tab="visual">🎨 Visual</div>
        <div class="admin-tab" data-tab="usuarios">👥 Usuarios</div>
        <div class="admin-tab" data-tab="banco">📋 Banco</div>
    </div>
    <script type="module">
        import { initSupabase, getSupabase } from './js/supabase-config.js?v=2.0.0';
        import { getSqlSetup } from './js/admin-config.js?v=1.0.0';
        import { isAdmin } from './js/admin-config.js';

const container = document.getElementById('admin-content');
        function addLog(msg) { console.log('[Admin]', msg); }

        // Captura erro global
        window.onerror = function(msg, src, line) {
            addLog('ERRO GLOBAL: ' + msg + ' (' + src + ':' + line + ')');
            if (container) container.innerHTML = '<div class="admin-card" style="text-align:center;padding:60px;"><h2>⚠ Erro no Portal</h2><p style="color:#ff6b6b;margin:20px 0;font-size:0.85rem;font-family:monospace;">' + msg + '<br><em>' + src + ':' + line + '</em></p><a href="index.html" class="btn-admin-save" style="text-decoration:none;">Voltar</a></div>';
        };

        // Tudo protegido
        (async function main() {
            try {
                addLog('Iniciando...');

                await initSupabase();
                addLog('Supabase inicializado');

                const supabase = await getSupabase();
                if (!supabase) {
                    addLog('ERRO: Supabase indisponivel');
                    container.innerHTML = '<div class="admin-card" style="text-align:center;padding:60px;"><h2>🔮 Conexao Indisponivel</h2><p style="color:#aaa;margin:20px 0;">Supabase nao respondeu. Verifique as credenciais em <code>js/env-config.js</code>.</p><p style="color:#888;font-size:0.8rem;margin-bottom:15px;">window.__SUPABASE_URL__ = ' + (window.__SUPABASE_URL__ ? 'definido' : 'VAZIO') + '</p><a href="index.html" class="btn-admin-save" style="text-decoration:none;">Voltar</a></div>';
                    return;
                }

                addLog('Buscando sessao...');
                const sesh = await supabase.auth.getSession();
                const session = sesh.data.session;
                const userId = session?.user?.id;
                const userEmail = session?.user?.email;
                addLog('Session: ' + (session ? 'OK (' + userEmail + ')' : 'NENHUMA'));
                addLog('UserId: ' + (userId || 'NENHUM'));

                if (!session) {
                    container.innerHTML = '<div class="admin-card" style="text-align:center;padding:60px;"><h2>🔮 Acesso Restrito</h2><p style="color:#aaa;margin:20px 0;">Voce precisa estar logado como administrador.</p><a href="login.html" class="btn-admin-save" style="text-decoration:none;">Fazer Login</a></div>';
                    return;
                }

                addLog('Verificando permissoes...');
                let adminStatus = false;
                if (userId) {
                    try { adminStatus = await isAdmin(userId); } catch(e) { addLog('isAdmin() erro: ' + e.message); }
                    if (!adminStatus && supabase) {
                        try {
                            const { data: rd, error: re } = await supabase.from('user_roles').select('role').eq('user_id', userId).maybeSingle();
                            if (!re && rd) { adminStatus = rd.role === 'admin' || rd.role === 'master'; addLog('Fallback role: ' + rd.role); }
                            else if (re) addLog('Fallback erro: ' + re.message);
                            else addLog('Fallback: sem registro');
                        } catch(e2) { addLog('Fallback exc: ' + e2.message); }
                    }
                }
                addLog('isAdmin: ' + adminStatus);

                if (!adminStatus) {
                    container.innerHTML = '<div class="admin-card" style="text-align:center;padding:60px;"><h2>🙏 Acesso Negado</h2><p style="color:#aaa;margin:20px 0;">Ola, <strong>' + userEmail + '</strong>. Voce nao tem permissao de administrador.</p><p style="color:#888;font-size:0.85rem;">Para se tornar admin, execute no SQL Editor do Supabase:</p><code style="background:#222;padding:10px;display:block;border-radius:5px;color:#0f0;font-size:0.75rem;word-break:break-all;">INSERT INTO user_roles (user_id, role)<br>SELECT id, \'admin\' FROM auth.users WHERE email = \'' + userEmail + '\'<br>ON CONFLICT (user_id) DO UPDATE SET role = \'admin\';</code><br><a href="index.html" class="btn-admin-save" style="text-decoration:none;">Voltar ao Portal</a></div>';
                    return;
                }

                window._adminUserId = userId; window._adminUserEmail = userEmail;
                await initTabs();
            } catch (err) {
                addLog('ERRO FATAL: ' + err.message);
                addLog('Stack: ' + (err.stack || 'sem stack'));
                console.error('[Admin] Fatal:', err);
                if (container) {
                    container.innerHTML = '<div class="admin-card" style="text-align:center;padding:60px;"><h2>⚠ Erro Inesperado</h2><p style="color:#ff6b6b;margin:20px 0;font-size:0.85rem;">' + err.message + '</p><p style="color:#888;font-size:0.8rem;font-family:monospace;word-break:break-all;">Stack: ' + (err.stack || '') + '</p><a href="admin.html" class="btn-admin-save" style="text-decoration:none;">🔄 Tentar Novamente</a></div>';
                }
            }
        })();

        async function initTabs() {
            addLog("Carregando modulo de abas...");
            try {
                const mod = await import("./js/admin-tabs.js?v=2.0.0");
                await mod.initTabs(container, window._adminUserEmail);
            } catch(e) {
                addLog("Erro: " + e.message);
                container.innerHTML = '<div class="admin-card" style="text-align:center;padding:60px;"><h2>Erro ao carregar painel</h2><p style="color:#ff6b6b;margin-top:15px;">' + e.message + '</p></div>';
            }
        }</script>
</body>
</html>
