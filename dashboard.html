<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal El'Luminar | Minha Jornada</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        .dash-container { max-width: 1000px; margin: 0 auto; padding: 80px 20px 100px; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 40px; }
        .dash-header h1 { font-family: 'Cinzel', serif; color: var(--ouro-solar); font-size: 1.8rem; }
        .dash-user-info { display: flex; align-items: center; gap: 15px; }
        .dash-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--dourado-antigo), var(--ouro-solar)); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #000; font-weight: bold; }
        .dash-user-name { color: #fff; font-size: 1rem; }
        .dash-user-email { color: #888; font-size: 0.85rem; }
        .btn-sair { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 100, 100, 0.3); color: #ff6b6b; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.3s; }
        .btn-sair:hover { background: rgba(255, 100, 100, 0.2); }
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .dash-card { background: rgba(5, 5, 16, 0.85); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 15px; padding: 25px; transition: all 0.3s; cursor: pointer; text-decoration: none; display: block; }
        .dash-card:hover { border-color: var(--dourado-antigo); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1); }
        .dash-card-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .dash-card h3 { font-family: 'Cinzel', serif; color: var(--ouro-solar); font-size: 1.1rem; margin-bottom: 8px; }
        .dash-card p { color: #aaa; font-size: 0.85rem; line-height: 1.4; }
        .dash-card .badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .badge-progresso { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid rgba(76, 175, 80, 0.3); }
        .dash-section-title { font-family: 'Cinzel', serif; color: var(--dourado-antigo); margin: 40px 0 20px; font-size: 1.2rem; }
        .dash-historico-item { background: rgba(5, 5, 16, 0.6); border: 1px solid rgba(212, 175, 55, 0.1); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .dash-historico-item .data { color: #888; font-size: 0.8rem; }
        .dash-historico-item .tipo { color: var(--ouro-solar); font-weight: bold; }
        .loading-dash { text-align: center; padding: 60px; color: #888; }
        .loading-dash .spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(212,175,55,0.2); border-top: 3px solid var(--ouro-solar); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Painel do Terapeuta (F2) ---------- */
        .tp-card { background: rgba(5, 5, 16, 0.85); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 15px; padding: 25px; }
        .tp-card code { background: #1a1a2a; padding: 2px 6px; border-radius: 4px; color: #9bd99e; font-size: 0.8rem; }
        .tp-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; flex-wrap: wrap; margin-bottom: 18px; }
        .tp-topo h3 { font-family: 'Cinzel', serif; color: var(--ouro-solar); font-size: 1.05rem; margin-bottom: 6px; }
        .tp-topo p { color: #999; font-size: 0.82rem; line-height: 1.5; }
        .tp-topo a { color: var(--dourado-antigo); }
        .tp-status { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: bold; white-space: nowrap; }
        .tp-status-on { background: rgba(76, 175, 80, 0.18); color: #7bd67f; border: 1px solid rgba(76, 175, 80, 0.35); }
        .tp-status-off { background: rgba(212, 175, 55, 0.12); color: #cbb26a; border: 1px solid rgba(212, 175, 55, 0.3); }
        .tp-aviso { background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.3); color: #9bd99e; border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; margin-bottom: 18px; }
        .tp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 16px; }
        .tp-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .tp-label { color: #a9a9bd; font-size: 0.72rem; letter-spacing: 0.4px; text-transform: uppercase; }
        .tp-input, .tp-select, .tp-textarea { background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(212, 175, 55, 0.22); border-radius: 8px; padding: 10px 12px; color: #eee; font-family: inherit; font-size: 0.88rem; width: 100%; }
        .tp-input:focus, .tp-select:focus, .tp-textarea:focus { outline: none; border-color: var(--ouro-solar); box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.12); }
        .tp-textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
        .tp-secao { border-top: 1px solid rgba(212, 175, 55, 0.12); margin-top: 8px; padding-top: 18px; margin-bottom: 8px; }
        .tp-secao h4 { font-family: 'Cinzel', serif; color: var(--dourado-antigo); font-size: 0.92rem; margin-bottom: 14px; }
        .tp-servico { display: grid; grid-template-columns: 1fr 90px 150px 34px; gap: 8px; margin-bottom: 8px; align-items: center; }
        .tp-remover { background: rgba(255, 107, 107, 0.12); border: 1px solid rgba(255, 107, 107, 0.3); color: #ff8a8a; border-radius: 8px; height: 38px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
        .tp-remover:hover { background: rgba(255, 107, 107, 0.25); }
        .tp-acoes { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .tp-btn { background: linear-gradient(135deg, var(--dourado-antigo), var(--ouro-solar)); color: #000; border: none; border-radius: 30px; padding: 12px 28px; font-weight: bold; font-size: 0.88rem; cursor: pointer; }
        .tp-btn:disabled { opacity: 0.6; cursor: wait; }
        .tp-btn-sec { background: rgba(212, 175, 55, 0.1); color: var(--ouro-solar); border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 30px; padding: 11px 22px; font-size: 0.85rem; cursor: pointer; }
        .tp-msg { font-size: 0.82rem; }
        .tp-msg-aviso { color: #ffab40; font-size: 0.85rem; line-height: 1.6; margin-bottom: 16px; }
        .tp-msg-erro { color: #ff6b6b; font-size: 0.85rem; }
        @media (max-width: 560px) {
            .tp-servico { grid-template-columns: 1fr 1fr; }
            .tp-servico .tp-remover { grid-column: 2; justify-self: end; width: 70px; }
            .tp-card { padding: 18px; }
        }

        /* ---------- Foto do terapeuta ---------- */
        .tp-foto-linha { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .tp-foto-preview {
            width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #6b3fa0, var(--ouro-solar));
            display: flex; align-items: center; justify-content: center;
            color: #000; font-weight: bold; font-size: 1.6rem; overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.4);
        }
        .tp-foto-preview img { width: 100%; height: 100%; object-fit: cover; }
        .tp-foto-acoes { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
        .tp-linha-2 { display: flex; gap: 8px; flex-wrap: wrap; }
        .tp-dica { color: #7f7f95; font-size: 0.72rem; line-height: 1.5; max-width: 320px; }

        /* ---------- Campos de atendimento ---------- */
        .tp-servico-head {
            color: #8f8fa5; font-size: 0.68rem; letter-spacing: 0.5px;
            text-transform: uppercase; margin-bottom: 6px;
        }
        .tp-duracao { position: relative; display: flex; align-items: center; }
        .tp-duracao input { padding-right: 42px; }
        .tp-duracao span {
            position: absolute; right: 12px; color: #8f8fa5; font-size: 0.78rem;
            pointer-events: none; text-transform: lowercase;
        }

        /* ---------- Modal de enquadramento da foto ---------- */
        .tp-crop {
            position: fixed; inset: 0; z-index: 1200; padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            display: flex; align-items: center; justify-content: center;
        }
        .tp-crop[hidden] { display: none; }
        .tp-crop-caixa {
            background: rgba(8, 8, 20, 0.98); border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; text-align: center;
        }
        .tp-crop-caixa h4 { font-family: 'Cinzel', serif; color: var(--ouro-solar); margin-bottom: 8px; }
        .tp-crop-caixa p { color: #999; font-size: 0.78rem; line-height: 1.5; margin-bottom: 16px; }
        .tp-crop-view {
            position: relative; width: 260px; height: 260px; margin: 0 auto 16px;
            border-radius: 50%; overflow: hidden; background: #0b0b16;
            cursor: grab; touch-action: none;
        }
        .tp-crop-view:active { cursor: grabbing; }
        .tp-crop-view img { position: absolute; user-select: none; pointer-events: none; max-width: none; }
        .tp-crop-guia {
            position: absolute; inset: 0; border-radius: 50%;
            box-shadow: inset 0 0 0 2px rgba(212, 175, 55, 0.55); pointer-events: none;
        }
        .tp-crop-caixa input[type="range"] { width: 100%; margin-bottom: 16px; accent-color: var(--ouro-solar); }
        .tp-crop-acoes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        @media (max-width: 560px) {
            .tp-crop-view { width: 220px; height: 220px; }
        }
    </style>
    <script src="js/env-config.js"></script>
</head>
<body>
    <a href="index.html" class="link-voltar-home">← Voltar ao Portal</a>
    <div class="dash-container" id="dash-content">
        <div class="loading-dash">
            <div class="spinner"></div>
            <p>Sintonizando sua jornada estelar...</p>
        </div>
    </div>
    <footer class="portal-footer">
        <div class="afirmacao-footer">"Que a Luz de Sirius guie teus passos."</div>
        <div class="info-rodape">
            <span></span>
            <p class="copyright">&copy; 2025 Portal El’Luminar. Guiado pelo Criamor.</p>
            <span class="footer-versao" title="O Voo da Águia">v2.1.0 &mdash; O Voo da Águia</span>
        </div>
    </footer>
<script type="module">
        import { initSupabase } from './js/supabase-config.js?v=2.1.0';
        import { getSession, getCurrentUser, signOut, onAuthChange, getAuthErrorFromUrl } from './js/supabase-auth.js?v=2.1.0';
        import { getUserReadings, getCourseProgress, getSessionHistory, saveUserProfile, syncUserProfile,
                 obterMeuPerfilTerapeuta, salvarPerfilTerapeuta, salvarServicosTerapeuta, salvarContatosTerapeuta,
                 uploadFotoTerapeuta, caminhoFotoTerapeuta, removerFotoTerapeuta,
                 formatarWhatsApp } from './js/supabase-db.js?v=2.1.0';

        await initSupabase();

        // Se o OAuth/confirmacao de email voltou com erro, avisa o usuario no login
        const _erroAuth = getAuthErrorFromUrl();
        if (_erroAuth) {
            window.location.replace('login.html?erro=' + encodeURIComponent(_erroAuth));
            throw new Error("Erro no retorno da autenticacao");
        }

        const session = await getSession();

        if (!session) {
            window.location.href = 'login.html?redirect=dashboard.html';
            throw new Error("Não autenticado");
        }

        const user = session.user;
        const container = document.getElementById('dash-content');

        // --- Perfil + Consentimento de Marketing ---
        let _userProfile = null;
        async function sincronizarPerfil() {
            try {
                _userProfile = await syncUserProfile(user);
            } catch (e) {
                console.warn('Perfil não sincronizado:', e);
            }
        }

        function bannerConsentimento() {
            if (!_userProfile || _userProfile.marketing_consent) return '';
            return `
                <div id="banner-consent" style="background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.35);border-radius:12px;padding:20px;margin-bottom:30px;">
                    <h3 style="font-family:'Cinzel',serif;color:var(--ouro-solar);margin-bottom:10px;font-size:1rem;">📩 Receba as Novidades do Portal</h3>
                    <p style="color:#bbb;font-size:0.85rem;margin-bottom:14px;">Autorize o envio de mensagens sobre novos oráculos, cursos e ativações. Você pode cancelar quando quiser.</p>
                    <label style="display:flex;align-items:center;gap:10px;color:#ddd;font-size:0.85rem;cursor:pointer;">
                        <input type="checkbox" id="chk-consent-dash" style="width:18px;height:18px;accent-color:var(--ouro-solar);cursor:pointer;">
                        Sim, quero receber novidades por email
                    </label>
                    <button id="btn-consent-dash" class="btn-sair" style="margin-top:14px;border-color:rgba(212,175,55,0.4);color:var(--ouro-solar);">Autorizar</button>
                    <span id="status-consent-dash" style="color:#4caf50;font-size:0.8rem;margin-left:12px;"></span>
                </div>
            `;
        }

        function renderDashboard() {
            const nome = user.user_metadata?.name || user.email?.split('@')[0] || 'Viajante';
            const email = user.email || '';
            const inicial = nome.charAt(0).toUpperCase();

            container.innerHTML = `
                <div class="dash-header">
                    <div><h1>🌟 Minha Jornada</h1></div>
                    <div class="dash-user-info">
                        <div>
                            <div class="dash-user-name" id="dash-nome">${nome}</div>
                            <div class="dash-user-email">${email}</div>
                        </div>
                        <div class="dash-avatar">${inicial}</div>
                        <button class="btn-sair" id="btn-sair">Sair</button>
                    </div>
                </div>

                ${bannerConsentimento()}

                <h2 class="dash-section-title">🔮 Ferramentas de Ascensão</h2>
                <div class="dash-grid">
                    <a href="taro2.html" class="dash-card">
                        <div class="dash-card-icon">🔮</div>
                        <h3>Tarô Divino Siriano</h3>
                        <p>Receba a orientação dos Mestres e a bênção de Sirius.</p>
                        <span class="badge badge-progresso">Acessar →</span>
                    </a>
                    <a href="dna.html" class="dash-card">
                        <div class="dash-card-icon">🧬</div>
                        <h3>DNA Solar</h3>
                        <p>Ativação dos filamentos solares.</p>
                        <span class="badge badge-progresso">Acessar →</span>
                    </a>
                    <a href="numerologia.html" class="dash-card">
                        <div class="dash-card-icon">📐</div>
                        <h3>Numerologia Estelar</h3>
                        <p>Descubra sua Missão e seu Mestre Regente.</p>
                        <span class="badge badge-progresso">Acessar →</span>
                    </a>
                    <a href="hawkins.html" class="dash-card">
                        <div class="dash-card-icon">💎</div>
                        <h3>Frequência Hawkins</h3>
                        <p>Diagnóstico vibracional da alma.</p>
                        <span class="badge badge-progresso">Acessar →</span>
                    </a>
                    <a href="bovis.html" class="dash-card">
                        <div class="dash-card-icon">📏</div>
                        <h3>Biômetro de Bovis</h3>
                        <p>Meça a vitalidade da sua Aura.</p>
                        <span class="badge badge-progresso">Acessar →</span>
                    </a>
                    <a href="cursos.html" class="dash-card">
                        <div class="dash-card-icon">📚</div>
                        <h3>Cursos & Saberes</h3>
                        <p>Jornadas de expansão da consciência.</p>
                        <span class="badge badge-progresso">Continuar →</span>
                    </a>
                    <a href="mestres.html" class="dash-card">
                        <div class="dash-card-icon">🧘</div>
                        <h3>Templo dos Mestres</h3>
                        <p>Conecte-se com os Guardiões.</p>
                        <span class="badge badge-progresso">Acessar →</span>
                    </a>
                    <a href="admin.html" id="admin-link-area" class="dash-card">
                        <div class="dash-card-icon">⚙️</div>
                        <h3>Painel Admin</h3>
                        <p>Configurações do Portal.</p>
                        <span class="badge badge-progresso">Acessar →</span>
                    </a>
                </div>

                <h2 class="dash-section-title">📜 Histórico Recente</h2>
                <div id="historico-lista">
                    <p style="color: #888; font-style: italic;">Carregando seu histórico...</p>
                </div>

                <h2 class="dash-section-title">🌿 Meu Espaço de Terapeuta</h2>
                <div id="terapeuta-panel">
                    <p style="color: #888; font-style: italic;">Verificando seu perfil de terapeuta...</p>
                </div>

                <!-- Visualizador de leitura (aberto ao clicar em "Ver leitura") -->
                <div id="leitura-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;overflow-y:auto;padding:40px 16px;">
                    <div style="max-width:760px;margin:0 auto;background:rgba(5,5,16,0.98);border:1px solid rgba(212,175,55,0.4);border-radius:15px;padding:28px;position:relative;">
                        <button id="btn-fechar-leitura" style="position:absolute;top:12px;right:14px;background:none;border:none;color:#aaa;font-size:1.5rem;cursor:pointer;line-height:1;">&times;</button>
                        <div id="leitura-conteudo"></div>
                    </div>
                </div>
            `;

            document.getElementById('btn-sair').addEventListener('click', async () => {
                await signOut();
            });

            const btnConsent = document.getElementById('btn-consent-dash');
            if (btnConsent) {
                btnConsent.addEventListener('click', async () => {
                    const chk = document.getElementById('chk-consent-dash');
                    if (!chk || !chk.checked) {
                        document.getElementById('status-consent-dash').innerText = 'Marque a opção para autorizar.';
                        document.getElementById('status-consent-dash').style.color = '#ff6b6b';
                        return;
                    }
                    const nome = user.user_metadata?.name || user.email?.split('@')[0] || '';
                    await saveUserProfile(user.id, { email: user.email, name: nome, marketing_consent: true });
                    _userProfile = { marketing_consent: true };
                    const banner = document.getElementById('banner-consent');
                    if (banner) banner.remove();
                });
            }

            // Fechar o visualizador de leitura
            const btnFechar = document.getElementById('btn-fechar-leitura');
            if (btnFechar) btnFechar.addEventListener('click', fecharLeitura);
            const modal = document.getElementById('leitura-modal');
            if (modal) {
                // clique fora da caixa fecha
                modal.addEventListener('click', function(ev) {
                    if (ev.target === modal) fecharLeitura();
                });
            }

            carregarHistorico();
            carregarPainelTerapeuta();
        }

        // --- Painel do Terapeuta (F2) ---
        // O perfil e criado/atualizado aqui; a vitrine le so os publicados.
        // Sem a secao 8 do supabase-schema.sql rodada, o painel avisa em vez
        // de quebrar (mesma estrategia de degradacao do resto do portal).
        let _meuPerfilTera = null;

        const MODALIDADES_TERA = [
            { v: 'ambos', t: 'Online e presencial' },
            { v: 'online', t: 'Somente online' },
            { v: 'presencial', t: 'Somente presencial' }
        ];

        const ROTULO_STATUS_TERA = {
            publicado: '🌿 Publicado na vitrine',
            pausado: '⏸ Pausado — fora da vitrine',
            rascunho: '📝 Rascunho — só você vê'
        };

        // Uma linha de atendimento (nome / duracao em min / valor em R$)
        function linhaServico(s) {
            s = s || {};
            const dur = (s.duracao_min === null || s.duracao_min === undefined) ? '' : esc(s.duracao_min);
            return `
                <div class="tp-servico">
                    <input class="tp-input tp-serv-nome" maxlength="80" placeholder="Ex.: Tiragem Tríade + Essência" value="${esc(s.nome || '')}">
                    <div class="tp-duracao">
                        <input class="tp-input tp-serv-dur" inputmode="numeric" maxlength="4" placeholder="60" value="${dur}">
                        <span>min</span>
                    </div>
                    <input class="tp-input tp-serv-preco" inputmode="decimal" maxlength="18" placeholder="R$ 180,00" value="${esc(s.preco || '')}">
                    <button type="button" class="tp-remover" title="Remover atendimento" aria-label="Remover atendimento">&times;</button>
                </div>
            `;
        }

        // Moeda: formata ao sair do campo ("180" -> "R$ 180,00") e devolve
        // o número puro ao entrar, para a edição não ficar travada.
        function formatarMoeda(v) {
            const limpo = String(v || '').replace(/[^\d,.]/g, '').replace(/\./g, '').replace(',', '.');
            const n = parseFloat(limpo);
            if (!isFinite(n)) return '';
            return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Telefone: a formatação vive em supabase-db.js (formatarWhatsApp),
        // a mesma usada na gravação — uma implementação só.

        async function carregarPainelTerapeuta() {
            const alvo = document.getElementById('terapeuta-panel');
            if (!alvo) return;

            try {
                const r = await obterMeuPerfilTerapeuta(user.id);

                if (r && r.indisponivel) {
                    alvo.innerHTML = `
                        <div class="tp-card">
                            <h3 style="font-family:'Cinzel',serif;color:var(--ouro-solar);margin-bottom:10px;font-size:1.05rem;">Seu perfil na vitrine</h3>
                            <p class="tp-msg-aviso">A vitrine ainda não está ativa neste banco. Rode a seção 8 do <code>supabase-schema.sql</code> no SQL Editor do Supabase e recarregue esta página.</p>
                            <a class="tp-btn-sec" href="seja-terapeuta.html" style="text-decoration:none;display:inline-block;">Entender como funciona →</a>
                        </div>`;
                    return;
                }

                if (!r || r.error) {
                    alvo.innerHTML = '<div class="tp-card"><p class="tp-msg-erro">Não foi possível carregar seu perfil: ' +
                        esc((r && r.error && r.error.message) || 'erro desconhecido') + '</p></div>';
                    return;
                }

                _meuPerfilTera = r.data;
                alvo.innerHTML = painelTerapeutaHTML(_meuPerfilTera, '');
                vincularPainelTerapeuta();
            } catch (e) {

        }

        function vincularPainelTerapeuta() {
            const raiz = document.getElementById('terapeuta-panel');
            if (!raiz) return;

            const btnAdd = document.getElementById('btn-tp-add-servico');
            if (btnAdd) {
                btnAdd.addEventListener('click', function () {
                    const box = document.getElementById('tp-servicos');
                    if (box) box.insertAdjacentHTML('beforeend', linhaServico());
                });
            }

            // Remover atendimento (delegado: vale para linhas novas também)
            raiz.addEventListener('click', function (ev) {
                const btn = ev.target.closest('.tp-remover');
                if (!btn) return;
                const linha = btn.closest('.tp-servico');
                if (linha) linha.remove();
            });

            const btnSalvar = document.getElementById('btn-tp-salvar');
            if (btnSalvar) {
                btnSalvar.addEventListener('click', function () {
                    const status = _meuPerfilTera && _meuPerfilTera.status
                        ? _meuPerfilTera.status
                        : 'rascunho';
                    salvarPainelTerapeuta(status);
                });
            }

            const btnPublicar = document.getElementById('btn-tp-publicar');
            if (btnPublicar) {
                btnPublicar.addEventListener('click', function () { salvarPainelTerapeuta('publicado'); });
            }

            const btnPausar = document.getElementById('btn-tp-pausar');
            if (btnPausar) {
                btnPausar.addEventListener('click', function () { salvarPainelTerapeuta('pausado'); });
            }

            vincularFotoTerapeuta();
            vincularMascaras(raiz);
        }

        // --- Foto: upload local com enquadramento (F2.1) ---
        let _crop = null;   // { img, view, base, escala, ox, oy, arrastando, inicioX, inicioY }

        // Máscaras: valor em R$ ao sair do campo e telefone no WhatsApp
        function vincularMascaras(raiz) {
            if (!raiz) return;

            raiz.addEventListener('focus', function (ev) {
                const el = ev.target;
                if (el && el.classList && el.classList.contains('tp-serv-preco') && /R\$/.test(el.value)) {
                    el.value = el.value.replace(/[^\d,]/g, '');
                }
            }, true);

            raiz.addEventListener('blur', function (ev) {
                const el = ev.target;
                if (!el || !el.classList) return;
                if (el.classList.contains('tp-serv-preco')) {
                    el.value = formatarMoeda(el.value);
                } else if (el.id === 'tp-wa') {
                    el.value = formatarWhatsApp(el.value);
                }
            }, true);
        }

        function vincularFotoTerapeuta() {
            const btn = document.getElementById('btn-tp-foto');
            const arquivo = document.getElementById('tp-foto-arquivo');

            if (btn && arquivo) {
                btn.addEventListener('click', function () { arquivo.click(); });
                arquivo.addEventListener('change', function () {
                    const f = arquivo.files && arquivo.files[0];
                    arquivo.value = '';
                    if (!f) return;
                    if (!/^image\//.test(f.type)) { alert('Escolha um arquivo de imagem (JPG ou PNG).'); return; }
                    if (f.size > 8 * 1024 * 1024) { alert('A imagem deve ter no máximo 8 MB.'); return; }
                    abrirCrop(f);
                });
            }

            const btnRemover = document.getElementById('btn-tp-foto-remover');
            if (btnRemover) {
                btnRemover.addEventListener('click', async function () {
                    const campo = document.getElementById('tp-foto');
                    const atual = campo ? campo.value : '';
                    if (campo) campo.value = '';
                    atualizarPreviewFoto('');

                    const aviso = document.getElementById('tp-status');
                    if (aviso) {
                        aviso.innerText = 'Foto removida. Clique em Salvar para confirmar no perfil.';
                        aviso.style.color = '#ffab40';
                    }

                    const caminho = caminhoFotoTerapeuta(atual);
                    if (caminho) {
                        try { await removerFotoTerapeuta(caminho); } catch (e) { /* melhor esforço */ }
                    }
                });
            }

            const zoom = document.getElementById('tp-crop-zoom');
            if (zoom) {
                zoom.addEventListener('input', function () {
                    if (!_crop) return;
                    _crop.escala = _crop.base * (parseInt(this.value, 10) / 100);
                    limitarCrop();
                    desenharCrop();
                });
            }

            const cancelar = document.getElementById('tp-crop-cancelar');
            if (cancelar) cancelar.addEventListener('click', fecharCrop);

            const salvar = document.getElementById('tp-crop-salvar');
            if (salvar) salvar.addEventListener('click', aplicarCrop);

            // Arrastar para posicionar (mouse e toque)
            const view = document.getElementById('tp-crop-view');
            if (view) {
                view.addEventListener('pointerdown', function (ev) {
                    if (!_crop) return;
                    _crop.arrastando = true;
                    _crop.inicioX = ev.clientX - _crop.ox;
                    _crop.inicioY = ev.clientY - _crop.oy;
                    try { view.setPointerCapture(ev.pointerId); } catch (e) { /* opcional */ }
                });
                view.addEventListener('pointermove', function (ev) {
                    if (!_crop || !_crop.arrastando) return;
                    _crop.ox = ev.clientX - _crop.inicioX;
                    _crop.oy = ev.clientY - _crop.inicioY;
                    limitarCrop();
                    desenharCrop();
                });
                const soltar = function () { if (_crop) _crop.arrastando = false; };
                view.addEventListener('pointerup', soltar);
                view.addEventListener('pointercancel', soltar);
                view.addEventListener('pointerleave', soltar);
            }
        }

        function abrirCrop(file) {
            const modal = document.getElementById('tp-crop');
            const view = document.getElementById('tp-crop-view');
            if (!modal || !view) return;

            const leitor = new FileReader();
            leitor.onload = function () {
                const img = new Image();
                img.onload = function () {
                    const lado = view.clientWidth || 260;
                    const base = Math.max(lado / img.naturalWidth, lado / img.naturalHeight);
                    _crop = {
                        img: img, view: lado, base: base, escala: base,
                        ox: 0, oy: 0, arrastando: false, inicioX: 0, inicioY: 0
                    };

                    const zoom = document.getElementById('tp-crop-zoom');
                    if (zoom) zoom.value = 100;
                    const msg = document.getElementById('tp-crop-msg');
                    if (msg) msg.innerText = '';

                    const visivel = document.getElementById('tp-crop-img');
                    if (visivel) visivel.src = img.src;

                    modal.hidden = false;
                    desenharCrop();
                };
                img.onerror = function () { alert('Não foi possível abrir esta imagem.'); };
                img.src = leitor.result;
            };
            leitor.readAsDataURL(file);
        }

        // Centraliza a imagem no círculo e aplica o deslocamento do arrasto
        function desenharCrop() {
            if (!_crop) return;
            const el = document.getElementById('tp-crop-img');
            if (!el) return;
            el.style.width = (_crop.img.naturalWidth * _crop.escala) + 'px';
            el.style.height = (_crop.img.naturalHeight * _crop.escala) + 'px';
            el.style.left = '50%';
            el.style.top = '50%';
            el.style.transform = 'translate(-50%, -50%) translate(' + _crop.ox + 'px, ' + _crop.oy + 'px)';
        }

        // Impede que a imagem "descole" e deixe buraco dentro do círculo
        function limitarCrop() {
            if (!_crop) return;
            const w = _crop.img.naturalWidth * _crop.escala;
            const h = _crop.img.naturalHeight * _crop.escala;
            const maxX = Math.max(0, (w - _crop.view) / 2);
            const maxY = Math.max(0, (h - _crop.view) / 2);
            _crop.ox = Math.min(maxX, Math.max(-maxX, _crop.ox));
            _crop.oy = Math.min(maxY, Math.max(-maxY, _crop.oy));
        }

        function fecharCrop() {
            const modal = document.getElementById('tp-crop');
            if (modal) modal.hidden = true;
            _crop = null;
        }

        function atualizarPreviewFoto(url) {
            const box = document.getElementById('tp-foto-preview');
            if (box) {
                if (url) {
                    box.innerHTML = '<img src="' + esc(url) + '" alt="Foto do perfil">';
                } else {
                    const campoNome = document.getElementById('tp-nome');
                    const nome = campoNome ? campoNome.value : '?';
                    box.textContent = String(nome || '?').trim().charAt(0).toUpperCase() || '?';
                }
            }
            const btn = document.getElementById('btn-tp-foto');
            if (btn) btn.innerText = url ? '🔄 Trocar foto' : '📷 Escolher foto';
            const rem = document.getElementById('btn-tp-foto-remover');
            if (rem) rem.hidden = !url;
        }

        // Recorta o que está no círculo, gera JPEG 480x480 e sobe pro Storage
        async function aplicarCrop() {
            if (!_crop) return;

            const msg = document.getElementById('tp-crop-msg');
            const dizer = function (t, c) { if (msg) { msg.innerText = t; msg.style.color = c || '#aaa'; } };

            const OUT = 480;
            const cv = document.createElement('canvas');
            cv.width = OUT;
            cv.height = OUT;
            const ctx = cv.getContext('2d');
            ctx.fillStyle = '#0b0b16';
            ctx.fillRect(0, 0, OUT, OUT);

            const k = OUT / _crop.view;
            const w = _crop.img.naturalWidth * _crop.escala;
            const h = _crop.img.naturalHeight * _crop.escala;
            const x = (_crop.view / 2 - w / 2 + _crop.ox) * k;
            const y = (_crop.view / 2 - h / 2 + _crop.oy) * k;
            ctx.drawImage(_crop.img, x, y, w * k, h * k);

            const btn = document.getElementById('tp-crop-salvar');
            if (btn) btn.disabled = true;
            dizer('Enviando...', '#d4af37');

            cv.toBlob(async function (blob) {
                if (!blob) {
                    dizer('Não foi possível gerar a imagem.', '#ff6b6b');
                    if (btn) btn.disabled = false;
                    return;
                }

                const campo = document.getElementById('tp-foto');
                const anterior = campo ? campo.value : '';

                const up = await uploadFotoTerapeuta(user.id, blob);

                if (up.indisponivel) {
                    dizer('Bucket de fotos não configurado. Rode a seção 8 do supabase-schema.sql.', '#ffab40');
                    if (btn) btn.disabled = false;
                    return;
                }
                if (up.error) {
                    dizer('Erro ao enviar: ' + up.error.message, '#ff6b6b');
                    if (btn) btn.disabled = false;
                    return;
                }

                if (campo) campo.value = up.url;
                atualizarPreviewFoto(up.url);

                // Apaga a foto anterior do bucket (melhor esforço: se falhar,
                // fica um arquivo órfão, sem afetar o perfil)
                const antigo = caminhoFotoTerapeuta(anterior);
                if (antigo && antigo !== up.caminho) {
                    try { await removerFotoTerapeuta(antigo); } catch (e) { /* opcional */ }
                }

                fecharCrop();

                const aviso = document.getElementById('tp-status');
                if (aviso) {
                    aviso.innerText = 'Foto enviada! Clique em Salvar para gravar no perfil.';
                    aviso.style.color = '#4caf50';
                }
            }, 'image/jpeg', 0.86);
        }

        // Coleta o formulário, grava perfil → atendimentos → contatos e
        // redesenha o painel com o estado vindo do banco.
        async function salvarPainelTerapeuta(status) {
            const msg = document.getElementById('tp-status');
            const dizer = function (texto, cor) {
                if (!msg) return;
                msg.innerText = texto;
                msg.style.color = cor || '#aaa';
            };
            const campo = function (id) {
                const el = document.getElementById(id);
                return el ? el.value : '';
            };

            const nome = campo('tp-nome').trim();
            if (!nome) {
                dizer('Informe o nome público.', '#ff6b6b');
                const el = document.getElementById('tp-nome');
                if (el) el.focus();
                return;
            }

            const especialidades = campo('tp-especs')
                .split(',')
                .map(function (s) { return s.trim(); })
                .filter(Boolean);

            const servicos = Array.prototype.map.call(
                document.querySelectorAll('#tp-servicos .tp-servico'),
                function (linha) {
                    return {
                        nome: (linha.querySelector('.tp-serv-nome').value || '').trim(),
                        duracao_min: linha.querySelector('.tp-serv-dur').value,
                        preco: (linha.querySelector('.tp-serv-preco').value || '').trim()
                    };
                }
            ).filter(function (s) { return s.nome; });

            const contatos = {
                whatsapp: campo('tp-wa').trim(),
                email_publico: campo('tp-email').trim(),
                instagram: campo('tp-instagram').trim(),
                facebook: campo('tp-facebook').trim(),
                youtube: campo('tp-youtube').trim(),
                site: campo('tp-site').trim()
            };

            const btn = document.getElementById('btn-tp-salvar');
            if (btn) btn.disabled = true;
            dizer('Salvando...', '#d4af37');

            try {
                const r = await salvarPerfilTerapeuta({
                    id: _meuPerfilTera ? _meuPerfilTera.id : undefined,
                    user_id: user.id,
                    nome: nome,
                    titulo: campo('tp-titulo').trim(),
                    especialidades: especialidades,
                    cidade: campo('tp-cidade').trim(),
                    modalidade: campo('tp-modalidade'),
                    anos: campo('tp-anos'),
                    bio: campo('tp-bio').trim(),
                    foto_url: campo('tp-foto').trim(),
                    status: status
                });

                if (r && r.indisponivel) {
                    dizer('A tabela therapists ainda não existe. Rode a seção 8 do supabase-schema.sql.', '#ffab40');
                    return;
                }
                if (!r || r.error) {
                    dizer('Erro ao salvar: ' + ((r && r.error && r.error.message) || 'desconhecido'), '#ff6b6b');
                    return;
                }

                _meuPerfilTera = r.data;
                const id = r.data && r.data.id;

                const rs = await salvarServicosTerapeuta(id, servicos);
                const rc = await salvarContatosTerapeuta(id, contatos);

                const avisos = [];
                if (rs && rs.error) avisos.push('atendimentos: ' + rs.error.message);
                if (rc && rc.error) avisos.push('contatos: ' + rc.error.message);

                // Recarrega do banco (serviços voltam com id e ordem)
                const atual = await obterMeuPerfilTerapeuta(user.id);
                if (atual && atual.data) _meuPerfilTera = atual.data;

                const sucesso = status === 'publicado'
                    ? '✅ Perfil publicado! Ele já aparece na vitrine.'
                    : (status === 'pausado' ? '✅ Perfil pausado: fora da vitrine.' : '✅ Perfil salvo como rascunho.');

                const alvo = document.getElementById('terapeuta-panel');
                if (alvo) {
                    alvo.innerHTML = painelTerapeutaHTML(
                        _meuPerfilTera,
                        avisos.length ? 'Perfil salvo, mas: ' + avisos.join(' · ') : sucesso
                    );
                    vincularPainelTerapeuta();
                }
            } catch (e) {
                dizer('Erro inesperado: ' + e.message, '#ff6b6b');
            } finally {
                const b = document.getElementById('btn-tp-salvar');
                if (b) b.disabled = false;
            }
        }

        // --- Visualizador de leitura (usa os dados ja gravados no Supabase) ---
        let _readingsCache = [];

        const ROTULOS_TIRAGEM = { unica: 'Tiragem Única', triade: 'Tríade (Passado/Presente/Futuro)', cruz: 'Cruz Cósmica' };

        function esc(v) {
            return String(v == null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Caminho da carta. A imagem da Essência inclui subpasta
        // (ex.: "Cartas da Essencia/1-ApresencadeSirian.png"), e ha arquivos
        // com espaco e acento no nome — por isso codificamos cada segmento.
        function cartaUrl(imagem) {
            if (!imagem) return '';
            return 'assets/cartas/' + String(imagem).split('/').map(encodeURIComponent).join('/');
        }

        function fecharLeitura() {
            const modal = document.getElementById('leitura-modal');
            if (modal) modal.style.display = 'none';
            document.body.style.overflow = '';
        }
        // Permite fechar com Esc
        document.addEventListener('keydown', function(ev) {
            if (ev.key === 'Escape') fecharLeitura();
        });

        function abrirLeitura(indice) {
            const r = _readingsCache[indice];
            if (!r) return;
            const conteudo = document.getElementById('leitura-conteudo');
            const modal = document.getElementById('leitura-modal');
            if (!conteudo || !modal) return;

            const cartas = Array.isArray(r.cartas) ? r.cartas : [];
            const cartasHtml = cartas.length
                ? cartas.map(c => `
                    <div style="text-align:center;width:110px;">
                        <img src="${cartaUrl(c.imagem)}" alt="${esc(c.nome)}"
                             onerror="this.style.display='none'"
                             style="width:90px;border-radius:8px;border:1px solid rgba(212,175,55,0.4);">
                        <div style="color:var(--ouro-solar);font-family:'Cinzel',serif;font-size:0.78rem;margin-top:8px;">${esc(c.nome)}</div>
                    </div>`).join('')
                : '<p style="color:#888;font-style:italic;">Cartas não registradas nesta leitura.</p>';

            conteudo.innerHTML = `
                <h2 style="font-family:'Cinzel',serif;color:var(--ouro-solar);font-size:1.25rem;margin-bottom:6px;">🔮 Leitura de Tarô</h2>
                <p style="color:#888;font-size:0.8rem;margin-bottom:20px;">
                    ${esc(new Date(r.created_at).toLocaleString('pt-BR'))}
                    &nbsp;•&nbsp; ${esc(ROTULOS_TIRAGEM[r.tipo_tiragem] || r.tipo_tiragem || 'Tiragem')}
                    &nbsp;•&nbsp; Consulente: <strong style="color:#ccc;">${esc(r.consulente || 'Anônimo')}</strong>
                </p>

                ${r.pergunta ? `<div style="background:rgba(212,175,55,0.07);border-left:2px solid var(--dourado-antigo);padding:12px 16px;border-radius:6px;margin-bottom:22px;">
                    <div style="color:#888;font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Pergunta</div>
                    <div style="color:#eee;font-style:italic;">${esc(r.pergunta)}</div>
                </div>` : ''}

                <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:24px;">${cartasHtml}</div>

                ${(r.essencia || r.essencia_imagem) ? `<div style="text-align:center;margin-bottom:24px;">
                    <div style="color:#888;font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">✨ Carta da Essência</div>
                    ${r.essencia_imagem ? `<img src="${cartaUrl(r.essencia_imagem)}" alt="${esc(r.essencia || 'Carta da Essência')}"
                        onerror="this.style.display='none'"
                        style="width:130px;border-radius:50%;border:3px solid var(--ouro-solar);box-shadow:0 0 18px rgba(255,170,0,0.35);margin-bottom:12px;">` : ''}
                    ${r.essencia ? `<div style="color:var(--ouro-solar);font-family:'Cinzel',serif;font-size:1.05rem;">${esc(r.essencia)}</div>` : ''}
                </div>` : ''}

                <div style="color:#888;font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">🤖 Canalização do Oráculo</div>
                ${r.interpretacao
                    ? `<div style="color:#e0e0e0;font-size:0.9rem;line-height:1.65;white-space:pre-wrap;">${esc(r.interpretacao)}</div>`
                    : `<p style="color:#ffab40;font-style:italic;font-size:0.85rem;">Esta leitura foi salva sem a canalização do Oráculo (a IA não respondeu no momento). As cartas e a pergunta estão preservadas acima.</p>`}

                ${r.notas_tarologo ? `<div style="margin-top:24px;padding-top:18px;border-top:1px solid rgba(212,175,55,0.25);">
                    <div style="color:#888;font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">🦁 Canalização do Guardião</div>
                    <div style="color:#e0e0e0;font-size:0.9rem;line-height:1.65;white-space:pre-wrap;">${esc(r.notas_tarologo)}</div>
                </div>` : ''}
            `;

            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        async function carregarHistorico() {
            const listaEl = document.getElementById('historico-lista');
            
            try {
                const { data: readings } = await getUserReadings(user.id, 12);
                _readingsCache = readings || [];

                if (_readingsCache.length > 0) {
                    listaEl.innerHTML = _readingsCache.map((r, i) => `
                        <div class="dash-historico-item">
                            <div>
                                <span class="tipo">🔮 Tarô</span>
                                <span style="color: #aaa; margin-left: 10px;">${esc(r.consulente || 'Anônimo')}</span>
                                ${(Array.isArray(r.cartas) && r.cartas.length) ? `<span style="color:#777;font-size:0.75rem;margin-left:8px;">${r.cartas.length} carta(s)</span>` : ''}
                            </div>
                            <div style="display:flex;align-items:center;gap:14px;">
                                <div class="data">${new Date(r.created_at).toLocaleDateString('pt-BR')}</div>
                                <button class="btn-ver-leitura" data-indice="${i}"
                                    style="background:none;border:1px solid rgba(212,175,55,0.4);color:var(--ouro-solar);border-radius:6px;padding:4px 12px;font-size:0.75rem;cursor:pointer;white-space:nowrap;">
                                    Ver leitura
                                </button>
                            </div>
                        </div>
                    `).join('');

                    // Abre o visualizador da leitura correspondente
                    listaEl.querySelectorAll('.btn-ver-leitura').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            abrirLeitura(parseInt(this.getAttribute('data-indice'), 10));
                        });
                    });
                } else {
                    listaEl.innerHTML = '<p style="color: #888; font-style: italic;">Suas leituras aparecerão aqui.</p>';
                }
            } catch (e) {
                listaEl.innerHTML = '<p style="color: #888; font-style: italic;">Histórico disponível após configurar o Supabase.</p>';
            }
        }

        await sincronizarPerfil();
        renderDashboard();

        // Link admin visivel para todos (acesso controlado na pagina)
    </script>
</body>
</html>
