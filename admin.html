<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Portal El'Luminar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        .admin-container { max-width: 900px; margin: 0 auto; padding: 100px 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .admin-header h1 { font-family: 'Cinzel'; color: var(--ouro-solar); font-size: 1.8rem; }
        .admin-card { background: rgba(5,5,16,0.95); border: 1px solid rgba(212,175,55,0.3); border-radius: 15px; padding: 30px; margin-bottom: 25px; }
        .admin-card h2 { font-family: 'Cinzel'; color: var(--dourado-antigo); font-size: 1.2rem; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .admin-card label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 5px; margin-top: 15px; }
        .admin-card label:first-child { margin-top: 0; }
        .admin-card select, .admin-card input, .admin-card textarea {
            width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3);
            border-radius: 8px; color: #fff; font-size: 0.95rem; font-family: 'Lato', sans-serif; outline: none;
            transition: border-color .3s;
        }
        .admin-card select:focus, .admin-card input:focus, .admin-card textarea:focus { border-color: var(--ouro-solar); }
        .admin-card select option { background: #111; color: #fff; }
        .admin-card textarea { min-height: 80px; resize: vertical; }
        .btn-admin-save { background: linear-gradient(135deg, var(--dourado-antigo), var(--ouro-solar)); border: none; padding: 12px 30px; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; font-family: 'Cinzel'; margin-top: 15px; transition: transform .2s; }
        .btn-admin-save:hover { transform: scale(1.02); }
        .btn-admin-save:disabled { opacity: .5; cursor: not-allowed; }
        .admin-status { padding: 10px 15px; border-radius: 8px; margin-top: 10px; font-size: 0.85rem; display: none; }
        .admin-status.success { display: block; background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3); color: #4caf50; }
        .admin-status.error { display: block; background: rgba(255,100,100,0.15); border: 1px solid rgba(255,100,100,0.3); color: #ff6b6b; }
        .admin-loading { text-align: center; padding: 60px; color: #888; }
        .admin-loading .spin { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(212,175,55,0.2); border-top: 3px solid var(--ouro-solar); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .admin-modelo-item { display: flex; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; transition: all .3s; }
        .admin-modelo-item:hover { border-color: rgba(212,175,55,0.3); }
        .admin-modelo-item.selecionado { border-color: var(--ouro-solar); background: rgba(255,170,0,0.05); }
        .admin-modelo-item input { width: auto; margin-right: 10px; }
        .admin-modelo-item .nome { color: #fff; font-weight: bold; flex: 1; }
        .admin-modelo-item .desc { color: #888; font-size: 0.8rem; }
        .admin-modelo-item .custo { font-size: 0.75rem; padding: 2px 10px; border-radius: 10px; margin-left: 10px; }
        .custo-baixo { background: rgba(76,175,80,0.2); color: #4caf50; }
        .custo-medio { background: rgba(255,193,7,0.2); color: #ffc107; }
        .sql-box { background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 0.75rem; color: #0f0; white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-top: 10px; }
        .sql-copy { background: rgba(255,255,255,0.1); border: 1px solid #555; color: #fff; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-top: 5px; }
    </style>
    <script src="js/env-config.js"></script>
</head>
<body>
    <a href="index.html" class="link-voltar-home">← Voltar ao Portal</a>
    <div class="admin-container" id="admin-content">
        <div class="admin-loading">
            <div class="spin"></div>
            <p>Verificando permissões estelares...</p>
        </div>
    </div>

    <script type="module">
        import { initSupabase, getSupabase } from './js/supabase-config.js?v=2.0.0';
        import { isAdmin, tornarAdmin, carregarConfig, salvarConfig, getSqlSetup } from './js/admin-config.js?v=1.0.0';
        import { MODELOS_DISPONIVEIS } from './js/modelos.js?v=1.0.0';

        await initSupabase();

        const supabase = await getSupabase();
        const { data: { session } } = await supabase.auth.getSession();
        const userId = session?.user?.id;
        const userEmail = session?.user?.email;
        const adminStatus = await isAdmin(userId);

        const container = document.getElementById('admin-content');

        function render() {
            if (!session) {
                container.innerHTML = '<div class="admin-card" style="text-align:center;padding:60px;"><h2>🔮 Acesso Restrito</h2><p style="color:#aaa;margin:20px 0;">Você precisa estar logado como administrador para acessar este painel.</p><a href="login.html" class="btn-admin-save" style="text-decoration:none;">Fazer Login</a></div>';
                return;
            }

            if (!adminStatus) {
                container.innerHTML = <div class="admin-card" style="text-align:center;padding:60px;"><h2>🙏 Acesso Negado</h2><p style="color:#aaa;margin:20px 0;">Olá, <strong></strong>. Você não tem permissão de administrador.</p><p style="color:#888;font-size:0.85rem;">Solicite ao mestre do portal que te conceda acesso.</p><a href="index.html" class="btn-admin-save" style="text-decoration:none;">Voltar ao Portal</a></div>;
                return;
            }

            // Admin logado - renderizar painel
            renderPainel();
        }

        async function renderPainel() {
            const config = await carregarConfig();
            const modeloAtivoId = config.modelo_ia?.id || window.__OPENROUTER_MODEL__ || '';

            let modelosHtml = '';
            const grupos = {};
            MODELOS_DISPONIVEIS.forEach(m => {
                if (!grupos[m.provedor]) grupos[m.provedor] = [];
                grupos[m.provedor].push(m);
            });
            for (const [prov, lista] of Object.entries(grupos)) {
                modelosHtml += <h4 style="color:var(--dourado-antigo);font-size:0.9rem;margin:15px 0 8px;"></h4>;
                lista.forEach(m => {
                    const sel = m.id === modeloAtivoId ? 'selecionado' : '';
                    const badgeCusto = m.custo === 'baixo' ? 'custo-baixo' : 'custo-medio';
                    modelosHtml += <label class="admin-modelo-item " data-modelo="">
                        <input type="radio" name="modelo-ia" value="" >
                        <span class="nome"></span>
                        <span class="desc"> — ctx: </span>
                        <span class="custo "></span>
                        
                    </label>;
                });
            }

            container.innerHTML = 
                <div class="admin-header">
                    <h1>⚙️ Portal da Administração</h1>
                    <span style="color:#888;font-size:0.85rem;">👤 </span>
                </div>

                <div class="admin-card">
                    <h2>🔮 Oráculo — Modelo de IA</h2>
                    <p style="color:#888;font-size:0.85rem;margin-bottom:15px;">Escolha qual modelo alimenta o Oráculo Siriano. A alteração é imediata.</p>
                    <div id="modelos-lista"></div>
                    <div id="status-modelo" class="admin-status"></div>
                    <button class="btn-admin-save" id="btn-salvar-modelo" disabled>💾 Salvar Modelo</button>
                </div>

                <div class="admin-card">
                    <h2>✨ Frase do Rodapé</h2>
                    <label>Frase de Afirmação</label>
                    <textarea id="input-afirmacao"></textarea>
                    <div id="status-afirmacao" class="admin-status"></div>
                    <button class="btn-admin-save" id="btn-salvar-afirmacao">💾 Salvar Frase</button>
                </div>

                <div class="admin-card">
                    <h2>🎨 Cores do Portal</h2>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;">
                        <div><label>Ouro Solar</label><input type="color" id="cor-ouro" value="" style="height:50px;padding:5px;cursor:pointer;"></div>
                        <div><label>Dourado Antigo</label><input type="color" id="cor-dourado" value="" style="height:50px;padding:5px;cursor:pointer;"></div>
                        <div><label>Azul Profundo</label><input type="color" id="cor-azul" value="" style="height:50px;padding:5px;cursor:pointer;"></div>
                    </div>
                    <div id="status-cores" class="admin-status"></div>
                    <button class="btn-admin-save" id="btn-salvar-cores">💾 Salvar Cores</button>
                </div>

                <div class="admin-card">
                    <h2>📋 Setup do Banco</h2>
                    <p style="color:#888;font-size:0.85rem;margin-bottom:10px;">Execute este SQL no SQL Editor do Supabase para criar as tabelas de configuração:</p>
                    <div class="sql-box" id="sql-setup"></div>
                    <button class="sql-copy" onclick="navigator.clipboard.writeText(document.getElementById('sql-setup').innerText).then(()=>this.innerText='✔ Copiado!').catch(()=>{})">📋 Copiar SQL</button>
                </div>
            ;

            // Preenche SQL
            document.getElementById('sql-setup').innerText = getSqlSetup();

            // Eventos
            document.querySelectorAll('input[name="modelo-ia"]').forEach(el => {
                el.addEventListener('change', () => {
                    document.getElementById('btn-salvar-modelo').disabled = false;
                });
            });

            document.getElementById('btn-salvar-modelo').addEventListener('click', async () => {
                const selected = document.querySelector('input[name="modelo-ia"]:checked');
                if (!selected) return;
                const modelo = MODELOS_DISPONIVEIS.find(m => m.id === selected.value);
                const btn = document.getElementById('btn-salvar-modelo');
                btn.disabled = true; btn.innerText = '💾 Salvando...';
                const result = await salvarConfig('modelo_ia', { id: modelo.id, nome: modelo.nome }, userId);
                if (result.success) {
                    document.getElementById('status-modelo').className = 'admin-status success';
                    document.getElementById('status-modelo').innerText = '✅ Modelo atualizado com sucesso!';
                    window.__OPENROUTER_MODEL__ = modelo.id;
                } else {
                    document.getElementById('status-modelo').className = 'admin-status error';
                    document.getElementById('status-modelo').innerText = '❌ Erro ao salvar.';
                }
                btn.innerText = '💾 Salvar Modelo';
            });

            document.getElementById('btn-salvar-afirmacao').addEventListener('click', async () => {
                const val = document.getElementById('input-afirmacao').value;
                const btn = document.getElementById('btn-salvar-afirmacao');
                btn.disabled = true; btn.innerText = '💾 Salvando...';
                const result = await salvarConfig('afirmacao_footer', val, userId);
                if (result.success) {
                    document.getElementById('status-afirmacao').className = 'admin-status success';
                    document.getElementById('status-afirmacao').innerText = '✅ Frase salva!';
                } else {
                    document.getElementById('status-afirmacao').className = 'admin-status error';
                    document.getElementById('status-afirmacao').innerText = '❌ Erro ao salvar.';
                }
                btn.disabled = false; btn.innerText = '💾 Salvar Frase';
            });

            document.getElementById('btn-salvar-cores').addEventListener('click', async () => {
                const cores = {
                    ouro_solar: document.getElementById('cor-ouro').value,
                    dourado_antigo: document.getElementById('cor-dourado').value,
                    azul_profundo: document.getElementById('cor-azul').value
                };
                const btn = document.getElementById('btn-salvar-cores');
                btn.disabled = true; btn.innerText = '💾 Salvando...';
                const result = await salvarConfig('cores', cores, userId);
                if (result.success) {
                    document.getElementById('status-cores').className = 'admin-status success';
                    document.getElementById('status-cores').innerText = '✅ Cores salvas! Recarregue a página para ver.';
                } else {
                    document.getElementById('status-cores').className = 'admin-status error';
                    document.getElementById('status-cores').innerText = '❌ Erro ao salvar.';
                }
                btn.disabled = false; btn.innerText = '💾 Salvar Cores';
            });
        }

        render();
    </script>
</body>
</html>
