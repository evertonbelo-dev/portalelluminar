<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal El'Luminar | Conexão</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: rgba(5,5,16,0.95); border: 1px solid var(--dourado-antigo); border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; backdrop-filter: blur(10px); box-shadow: 0 0 50px rgba(212,175,55,0.1); }
        .auth-card h1 { font-family: 'Cinzel',serif; color: var(--ouro-solar); text-align: center; font-size: 1.5rem; margin-bottom: 5px; }
        .auth-card .subtitulo { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 0.9rem; }
        .auth-tabs { display: flex; gap: 0; margin-bottom: 25px; border-bottom: 1px solid rgba(212,175,55,0.3); }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #888; font-family: 'Cinzel',serif; font-size: 0.85rem; transition: all .3s; border-bottom: 2px solid transparent; }
        .auth-tab.ativo { color: var(--ouro-solar); border-bottom-color: var(--ouro-solar); }
        .auth-form { display: flex; flex-direction: column; gap: 18px; }
        .auth-form.oculto { display: none; }
        .campo-label { color: var(--dourado-antigo); font-size: 0.85rem; margin-bottom: 3px; }
        .auth-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3); border-radius: 10px; padding: 12px 16px; color: #fff; font-size: 1rem; width: 100%; outline: none; transition: border-color .3s; }
        .auth-input:focus { border-color: var(--ouro-solar); }
        .auth-btn { background: linear-gradient(135deg,var(--dourado-antigo),var(--ouro-solar)); border: none; border-radius: 10px; padding: 14px; color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; transition: transform .2s,opacity .3s; font-family: 'Cinzel',serif; }
        .auth-btn:hover { transform: scale(1.02); opacity: .9; }
        .auth-error { color: #ff6b6b; font-size: .85rem; padding: 8px 12px; background: rgba(255,100,100,0.1); border-radius: 8px; border: 1px solid rgba(255,100,100,0.2); display: none; }
        .auth-error:not(:empty) { display: block; }
        .auth-success { color: #4caf50; font-size: .85rem; padding: 8px 12px; background: rgba(76,175,80,0.1); border-radius: 8px; border: 1px solid rgba(76,175,80,0.2); }
        .auth-divider { text-align: center; color: #555; font-size: .85rem; position: relative; }
        .auth-divider::before,.auth-divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: rgba(212,175,55,0.2); }
        .auth-divider::before { left: 0; }
        .auth-divider::after { right: 0; }
        .auth-google-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px; color: #fff; font-size: .9rem; cursor: pointer; transition: all .3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .auth-google-btn:hover { background: rgba(255,255,255,0.15); }
        .auth-link { text-align: center; margin-top: 5px; }
        .auth-link a { color: #888; font-size: .8rem; cursor: pointer; text-decoration: underline; }
        .auth-link a:hover { color: var(--ouro-solar); }
        .logo-simbolo { text-align: center; margin-bottom: 15px; }
        .logo-simbolo img { width: 80px; height: auto; filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top: 2px solid #fff; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-simbolo"><a href="index.html"><img src="assets/PortalElluminar/Simbolo_Portal.png" alt="Símbolo"></a></div>
            <h1>Portal El'Luminar</h1>
            <p class="subtitulo">Acesse sua jornada estelar</p>
            <div class="auth-tabs">
                <div class="auth-tab ativo" onclick="switchTab('entrar')">Entrar</div>
                <div class="auth-tab" onclick="switchTab('cadastrar')">Cadastrar</div>
            </div>
            <form id="form-entrar" class="auth-form" onsubmit="handleLogin(event)">
                <div><label class="campo-label">Email Estelar</label><input type="email" id="email-login" class="auth-input" placeholder="seu@email.com" required></div>
                <div><label class="campo-label">Senha Cósmica</label><input type="password" id="senha-login" class="auth-input" placeholder="••••••••" required></div>
                <div id="login-error" class="auth-error"></div>
                <button type="submit" id="btn-login" class="auth-btn">Entrar</button>
                <div class="auth-divider">— ou —</div>
                <button type="button" class="auth-google-btn" onclick="handleGoogleLogin()"><span>🔮</span> Entrar com Google</button>
                <div class="auth-link"><a onclick="mostrarRecuperarSenha()">Esqueceu a senha?</a></div>
            </form>
            <form id="form-cadastrar" class="auth-form oculto" onsubmit="handleSignUp(event)">
                <div><label class="campo-label">Nome Estelar</label><input type="text" id="nome-cadastro" class="auth-input" placeholder="Seu nome" required></div>
                <div><label class="campo-label">Email Estelar</label><input type="email" id="email-cadastro" class="auth-input" placeholder="seu@email.com" required></div>
                <div><label class="campo-label">Senha Cósmica</label><input type="password" id="senha-cadastro" class="auth-input" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
                <div id="cadastro-error" class="auth-error"></div>
                <div id="cadastro-success" class="auth-success"></div>
                <button type="submit" id="btn-cadastro" class="auth-btn">Criar Conta Estelar</button>
                <div class="auth-divider">— ou —</div>
                <button type="button" class="auth-google-btn" onclick="handleGoogleLogin()"><span>🔮</span> Cadastrar com Google</button>
            </form>
            <div style="text-align:center;margin-top:25px"><a href="index.html" style="color:#888;font-size:.8rem">← Voltar ao Portal</a></div>
        </div>
    </div>
    <script type="module">
        import { initSupabase } from './js/supabase-config.js?v=2.0.0';
        import { signIn, signUp, signInWithGoogle, getSession } from './js/supabase-auth.js?v=2.0.0';
        await initSupabase();
        const session = await getSession();
        if (session) window.location.href = '/dashboard.html';
        window.__supabaseSignIn = signIn;
        window.__supabaseSignUp = signUp;
        window.__supabaseGoogle = signInWithGoogle;
    </script>
    <script>
        function switchTab(tab){document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('ativo'));document.querySelectorAll('.auth-form').forEach(f=>f.classList.add('oculto'));if(tab==='entrar'){document.querySelector('.auth-tab:first-child').classList.add('ativo');document.getElementById('form-entrar').classList.remove('oculto')}else{document.querySelector('.auth-tab:last-child').classList.add('ativo');document.getElementById('form-cadastrar').classList.remove('oculto')}}
        async function handleLogin(event){event.preventDefault();const email=document.getElementById('email-login').value;const senha=document.getElementById('senha-login').value;const btn=document.getElementById('btn-login');const errorDiv=document.getElementById('login-error');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Conectando...';errorDiv.innerText='';const{data,error}=await window.__supabaseSignIn(email,senha);if(error){errorDiv.innerText=error.message||"Erro ao conectar. Tente novamente.";btn.disabled=false;btn.innerText='Entrar'}else{window.location.href='/dashboard.html'}}
        async function handleSignUp(event){event.preventDefault();const email=document.getElementById('email-cadastro').value;const senha=document.getElementById('senha-cadastro').value;const nome=document.getElementById('nome-cadastro').value;const btn=document.getElementById('btn-cadastro');const errorDiv=document.getElementById('cadastro-error');const successDiv=document.getElementById('cadastro-success');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Criando...';errorDiv.innerText='';successDiv.innerText='';const{data,error}=await window.__supabaseSignUp(email,senha,{name:nome});if(error){errorDiv.innerText=error.message||"Erro ao criar conta.";btn.disabled=false;btn.innerText='Criar Conta Estelar'}else{successDiv.innerText='✨ Conta criada! Verifique seu email para confirmar.';btn.disabled=false;btn.innerText='Criar Conta Estelar'}}
        async function handleGoogleLogin(){await window.__supabaseGoogle()}
        function mostrarRecuperarSenha(){alert("Função de recuperação de senha em breve. Enquanto isso, entre em contato pelo suporte.")}
    </script>
</body>
</html>
